project:
  type: book
  output-dir: _book
  resources:
    - LICENSE
    - LICENSE-CONTENT.md
    - LICENSE-CODE.md
    - cover.png
    - images/**
    - tools/**
    - resources/**

book:
  title: "Partner, Don't Police: AI in the Business Classroom"
  author: "Michael Borck"
  isbn: "979-8-2542-3619-1"
  date: today
  license: "CC BY 4.0 International"
  description: "A practical guide for business educators on integrating AI as a teaching partner across disciplines, with ready-to-use prompts, assessment frameworks, and discipline-specific examples."
  favicon: favicon.svg
  sidebar:
    footer: |
      Paperback ISBN 979-8-2542-3619-1<br>
      [Support the open edition](https://www.amazon.com.au/s?k=9798254236191)
  chapters:
    - index.qmd
    - copyright.qmd
    - acknowledgments.qmd
    - chapters/introduction.qmd
    - chapters/understanding-ai.qmd
    - chapters/ethics-integrity.qmd
    - chapters/getting-started.qmd
    - chapters/seven-techniques.qmd
    - chapters/managing-context.qmd
    - chapters/critique-toolkit.qmd
    - chapters/flight-simulator.qmd
    - chapters/self-assessment.qmd
    - chapters/assessment.qmd
    - chapters/transforming-content.qmd
    - chapters/virtual-company.qmd
    - chapters/unit-design.qmd
    - chapters/global-perspectives.qmd
    - chapters/implementation-practicalities.qmd
    - chapters/conclusion.qmd
  appendices:
    - appendices/pilot-pack.qmd
    - appendices/prompt-library.qmd
    - appendices/workshop-guide.qmd
    - appendices/institutional-alignment.qmd
    - appendices/rubric-system.qmd
    - appendices/stress-test-sequence.qmd
    - appendices/glossary.qmd
    - appendices/further-reading.qmd
    - about-author.qmd
  other-links:
    - text: Download PDF
      icon: file-pdf
      href: /partner-dont-police.pdf
    - text: Download EPUB
      icon: book
      href: /partner-dont-police.epub
    - text: Download llm.txt
      icon: robot
      href: /llm.txt
    - text: GitHub
      icon: github
      href: https://github.com/michael-borck/partner-dont-police
    - text: DeepWiki
      icon: search
      href: https://deepwiki.com/michael-borck/partner-dont-police
    - text: All Books
      icon: collection
      href: https://books.borck.education
    - text: Amazon
      icon: cart
      href: https://www.amazon.com.au/s?k=9798254236191
    - text: Prompt Library
      icon: list-task
      href: /appendices/prompt-library.html
    - text: Workshop Guide
      icon: easel
      href: /appendices/workshop-guide.html

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    cover-image: cover.png
    include-after-body: chatbot.html
    toc: true
    toc-depth: 3
    number-sections: true
    code-tools: true
  pdf:
    documentclass: book
    toc: true
    toc-depth: 1
    number-sections: true
    hyperrefoptions: draft
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - inner=1in
      - outer=0.625in
      - top=0.75in
      - bottom=0.75in
    include-in-header: pdf-header.tex
    include-before-body:
      - copyright-page.tex
  epub:
    toc: true
    toc-depth: 1
    css: epub-styles.css
